[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injectwall"
version = "0.1.0"
description = "A local-first, deterministic prompt-injection testing harness"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ashil Asok"}]
dependencies = []

[project.scripts]
injectwall = "injectwall.cli:main"

[tool.setuptools]
packages = ["injectwall"]
include-package-data = true

[tool.setuptools.package-data]
injectwall = ["fixtures/*.json"]
